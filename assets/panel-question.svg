<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="pq-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#f4e3c2"/>

  <!-- misregistered second ink, the way a two-colour riso pull sits a hair off -->
  <text x="556" y="760" text-anchor="middle" font-size="620" font-weight="bold" fill="#c2622f">?</text>
  <text x="540" y="744" text-anchor="middle" font-size="620" font-weight="bold" fill="#1d4030">?</text>

  <rect x="9" y="9" width="1062" height="1062" fill="none" stroke="#1d4030" stroke-width="18"/>
  <rect width="1080" height="1080" filter="url(#pq-grain)" opacity="0.6"/>
</svg>
