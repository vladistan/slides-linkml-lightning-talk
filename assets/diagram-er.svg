<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210">
  <defs>
    <marker id="er-arrow" viewBox="0 0 10 7" refX="10" refY="3.5"
            markerWidth="9" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#774c27"/>
    </marker>
  </defs>

  <!-- corner anchors hold the viewBox still across slides -->
  <circle cx="3" cy="3" r="1.5" fill="none"/>
  <circle cx="637" cy="207" r="1.5" fill="none"/>

  <g font-family="monospace" fill="#173128">
    <rect x="20" y="55" width="210" height="100" rx="8"
          fill="none" stroke="#173128" stroke-width="2.5"/>
    <text x="125" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="#774c27">Species</text>
    <line x1="20" y1="90" x2="230" y2="90" stroke="#173128" stroke-width="1.5"/>
    <text x="38" y="112" font-size="13">name</text>
    <text x="38" y="132" font-size="13">weight_kg</text>
    <text x="38" y="150" font-size="13">habitat</text>

    <rect x="430" y="10" width="190" height="75" rx="8"
          fill="none" stroke="#173128" stroke-width="2"/>
    <text x="525" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#774c27">Move</text>
    <line x1="430" y1="45" x2="620" y2="45" stroke="#173128" stroke-width="1.5"/>
    <text x="448" y="68" font-size="13">name, power</text>

    <rect x="430" y="125" width="190" height="75" rx="8"
          fill="none" stroke="#173128" stroke-width="2"/>
    <text x="525" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#774c27">Ability</text>
    <line x1="430" y1="160" x2="620" y2="160" stroke="#173128" stroke-width="1.5"/>
    <text x="448" y="183" font-size="13">name</text>

    <line x1="230" y1="90" x2="430" y2="48" stroke="#774c27" stroke-width="2.5" marker-end="url(#er-arrow)"/>
    <line x1="230" y1="125" x2="430" y2="162" stroke="#774c27" stroke-width="2.5" marker-end="url(#er-arrow)"/>
    <text x="330" y="58" text-anchor="middle" font-size="12" fill="#774c27">many</text>
    <text x="330" y="165" text-anchor="middle" font-size="12" fill="#774c27">many</text>
  </g>
